[project]
name = "ampav-azure"
version = "0.0.1"
description = "Azure tooling for the AMPAV environment"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",   
]
authors = [
    {name = "Brian Wheeler", email="bdwheele@iu.edu"},
]

requires-python = ">=3.12"
dependencies = [
    "ampav-core>=0.0.12",
    "azure-identity",
]

[project.urls]
Homepage = "https://github.com/AMPAV/ampav-azure"
Repository = "https://github.com/AMPAV/ampav-azure.git"
Issues = "https://github.com/AMPAV/ampav-azure/issues"


[project.scripts]
amapv_whisper_transcribe = "ampav.parakeet.transcribe:cli_whisper_transcribe"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"